# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# The language of the webpage › http://www.lingoes.net/en/translator/langcode.htm
# If it has the same name as one of the files in folder `_data/locales`, the layout language will also be changed,
# otherwise, the layout language will use the default value of 'en'.
lang: en

# Change to your timezone › https://zones.arilyn.cc
timezone: Africa/Nouakchott

# jekyll-seo-tag settings › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# ↓ --------------------------

title: Abdellahi Zerough # the main title

tagline: Cybersecurity Engineer , SOC, Blue Team, Cloud Security # it will display as the subtitle

description: >- # used by seo meta and the atom feed
  Write-ups, projects, and notes on SOC, detection engineering, and cloud security by Abdellahi Ahmed Zerough.

# Fill in the protocol & hostname for your site.
# E.g. 'https://abdallahi34.github.io', note that it does not end with a '/'.
url: "https://abdallahi34.github.io"

github:
  username: abdallahi34 # change to your GitHub username

social:
  # Change to your full name.
  # It will be displayed as the default author of the posts and the copyright owner in the Footer
  name: Abdellahi Ahmed Zerough
  email: abdallahizerough@gmail.com # change to your email address
  links:
    # The first element serves as the copyright owner's link
    - https://www.linkedin.com/in/abdellahi-ahmed-zerough/
    - https://github.com/abdallahi34
    - https://app.hackthebox.com/users/abdellahi24
    # Uncomment below to add more social links
    # - https://www.facebook.com/username

# Site Verification Settings
webmaster_verifications:
  google: # fill in your Google Search Console verification code
  bing: # fill in your Bing verification code
  alexa: # fill in your Alexa verification code
  yandex: # fill in your Yandex verification code
  baidu: # fill in your Baidu verification code
  facebook: # fill in your Facebook verification code

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings

# Web Analytics Settings
analytics:
  google:
    id: # fill in your Google Analytics ID, or leave empty to disable
  goatcounter:
    id: # fill in your GoatCounter ID
  umami:
    id: # fill in your Umami ID
    domain: # fill in your Umami domain
  matomo:
    id: # fill in your Matomo ID
    domain: # fill in your Matomo domain
  cloudflare:
    id: # fill in your Cloudflare Web Analytics token
  fathom:
    id: # fill in your Fathom Site ID

# Page views settings
pageviews:
  provider: # now only supports 'goatcounter'

# Prefer color scheme setting.
#
# Note: Keep empty will follow the system prefer color by default,
# and there will be a toggle to switch the theme between dark and light
# on the bottom left of the sidebar.
#
# Available options:
#
#     light , Use the light color scheme
#     dark , Use the dark color scheme
#
theme_mode: dark # [light | dark] , dark by default to match the CloudGuard / LinkedIn cover branding

# The CDN endpoint for media resources.
cdn:

# the avatar on sidebar, support local or CORS resources
avatar: assets/img/avatar.png

# The URL of the site-wide social preview image used in SEO `og:image` meta tag.
social_preview_image: assets/img/avatar.png # string, local or CORS resources

# boolean type, the global switch for TOC in posts.
toc: true

comments:
  # Global switch for the post-comment system. Keeping it empty means disabled.
  # Left disabled for now , see README for how to turn on giscus (recommended: uses GitHub
  # Discussions, no third-party account needed) once GitHub Discussions is enabled on this repo.
  provider: # [disqus | utterances | giscus]
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  # Giscus options › https://giscus.app , go there, connect this repo, and paste the values it gives you,
  # then set provider: giscus above.
  giscus:
    repo: abdallahi34/abdallahi34.github.io
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:

# Self-hosted static assets, optional › https://github.com/cotes2020/chirpy-static-assets
assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

# The base URL of your site
baseurl: ""

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
